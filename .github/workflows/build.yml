name: 打包 GreenHouse
# 自动构建 Windows 可执行文件
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: 打包
        run: |
          pyinstaller --name=GreenHouse --windowed --noconfirm --clean --onefile `
            --hidden-import=serial --hidden-import=matplotlib --hidden-import=matplotlib.backends.backend_tkagg `
            --hidden-import=matplotlib.figure --hidden-import=matplotlib.backends.backend_agg `
            --hidden-import=kiwisolver --hidden-import=matplotlib.font_manager main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GreenHouse-Windows
          path: dist/GreenHouse.exe
